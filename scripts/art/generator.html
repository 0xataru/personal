<!doctype html>
<!--
  Low-poly portrait generator.
  Traces source.jpg into Delaunay triangles and prints JSON for src/data/art/portrait.ts.
  Usage: node scripts/art/generate.mjs
-->
<html><body style="margin:0;background:#121110">
<canvas id="c" width="540" height="620"></canvas>
<pre id="out"></pre>
<script src="https://cdn.jsdelivr.net/npm/delaunator@5/delaunator.min.js"></script>
<script>
let W = 540, H = 620; const CX = 270;
const cv = document.getElementById('c');
const g = cv.getContext('2d', { willReadFrequently: true });
let seed = 4242;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

function path(P, smooth) {
  g.beginPath();
  if (smooth) {
    const n = P.length;
    g.moveTo(P[0][0], P[0][1]);
    for (let i = 0; i < n; i++) {
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      g.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
        p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
    }
  } else P.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
  g.closePath();
}
const mirror = P => P.map(([x, y]) => [W - x, y]);
const sym = P => P.concat(mirror(P.slice().reverse()));
function fill(P, color, smooth = false) { path(P, smooth); g.fillStyle = color; g.fill(); }
function line(P, color, w) {
  g.beginPath(); P.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
  g.strokeStyle = color; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
}
function ell(x, y, rx, ry, color) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fillStyle = color; g.fill(); }

const img = new Image();
img.onload = () => { H = Math.round(W * img.height / img.width); cv.height = H; g.drawImage(img, 0, 0, W, H); run(true); };
img.src = new URLSearchParams(location.search).get('src') || 'source.jpg';

function run(imageMode) {
  const img = g.getImageData(0, 0, W, H).data;
  if (imageMode) {
    // flood-fill the near-black backdrop from the borders and make it transparent
    const bg = new Uint8Array(W * H), stack = [];
    const dark = i => img[i * 4] + img[i * 4 + 1] + img[i * 4 + 2] < 34;
    for (let x = 0; x < W; x++) stack.push(x, (H - 1) * W + x);
    for (let y = 0; y < H; y++) stack.push(y * W, y * W + W - 1);
    while (stack.length) {
      const i = stack.pop();
      if (bg[i] || !dark(i)) continue;
      bg[i] = 1;
      const x = i % W, y = (i / W) | 0;
      if (x > 0) stack.push(i - 1); if (x < W - 1) stack.push(i + 1);
      if (y > 0) stack.push(i - W); if (y < H - 1) stack.push(i + W);
    }
    for (let i = 0; i < W * H; i++) {
      if (bg[i]) { img[i * 4 + 3] = 0; continue; }
      // lift shadows so the hoodie still reads on a dark page
      // and add a gentle S-curve so flat facets keep some contrast
      for (let k = 0; k < 3; k++) {
        const v = Math.pow(img[i * 4 + k] / 255, 0.82);
        img[i * 4 + k] = 255 * Math.min(1, Math.max(0, v + 0.12 * (v - 0.5) * (1 - Math.abs(2 * v - 1)) * 2));
      }
    }
  }
  const px = (x, y) => {
    x = Math.max(0, Math.min(W - 1, x | 0)); y = Math.max(0, Math.min(H - 1, y | 0));
    const i = (y * W + x) * 4;
    return [img[i], img[i + 1], img[i + 2], img[i + 3]];
  };
  // Edge strength map: Sobel over a lightly blurred copy, so JPEG noise in the
  // hair does not count as structure. Normalised to 0..1 (95th percentile = 1).
  const lum = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) {
    lum[i] = img[i * 4 + 3] < 128 ? 0 : 0.3 * img[i * 4] + 0.59 * img[i * 4 + 1] + 0.11 * img[i * 4 + 2];
  }
  const blur = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let sum = 0, n = 0;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
      sum += lum[yy * W + xx]; n++;
    }
    blur[y * W + x] = sum / n;
  }
  const emap = new Float32Array(W * H);
  const at = (x, y) => blur[Math.min(H - 1, Math.max(0, y)) * W + Math.min(W - 1, Math.max(0, x))];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const gx = at(x + 1, y - 1) + 2 * at(x + 1, y) + at(x + 1, y + 1) - at(x - 1, y - 1) - 2 * at(x - 1, y) - at(x - 1, y + 1);
    const gy = at(x - 1, y + 1) + 2 * at(x, y + 1) + at(x + 1, y + 1) - at(x - 1, y - 1) - 2 * at(x, y - 1) - at(x + 1, y - 1);
    emap[y * W + x] = Math.hypot(gx, gy);
  }
  const sorted = Array.from(emap).filter(v => v > 0).sort((a, b) => a - b);
  const e95 = sorted[Math.floor(sorted.length * 0.95)] || 1;
  const edge = (x, y) => Math.min(1, emap[(y | 0) * W + (x | 0)] / e95);
  // Target spacing between points. Every feature grows linearly with distance,
  // so triangle size changes gradually instead of in visible bands.
  const features = [
    // [x, y, spacing at centre, growth per px]
    [228, 240, 3, 0.2],   // left eye
    [318, 240, 3, 0.2],   // right eye
    [277, 335, 5, 0.3],   // mouth
    [278, 270, 7.5, 0.06], // face
    [275, 460, 10, 0.2],  // drawstrings
  ];
  const detail = (x, y) => {
    const t = Math.min(1, Math.max(0, (y - 380) / 80));
    let r = 12 + t * 7; // hair, easing into larger facets on the hoodie
    for (const [fx, fy, r0, k] of features) r = Math.min(r, r0 + k * Math.hypot(x - fx, y - fy));
    return r;
  };
  const pts = [];
  const accept = (x, y, e) => {
    // tighter spacing on strong edges so facets follow the drawing's lines
    const r = detail(x, y) * (1.2 - 0.55 * e);
    for (const [a, b] of pts) if ((a - x) ** 2 + (b - y) ** 2 < r * r) return false;
    pts.push([x, y]); return true;
  };
  const cands = [];
  for (let i = 0; i < 140000; i++) {
    const x = rnd() * (W - 2) + 1, y = rnd() * (H - 2) + 1;
    const e = edge(x, y);
    if (px(x, y)[3] === 0 && e === 0) continue;
    cands.push([x, y, e, e + rnd() * 0.08]);
  }
  cands.sort((a, b) => b[3] - a[3]);
  for (const [x, y, e] of cands) accept(x, y, e);

  const del = new Delaunator(pts.flatMap(p => p));
  const triColor = (A, B, C) => {
    // sample only the inner part of the triangle so colours do not bleed across edges
    let r = 0, gg = 0, b = 0, n = 0, tot = 0; const S = 10;
    for (let i = 0; i <= S; i++) for (let j = 0; j <= S - i; j++) {
      const u = (i + 0.33) / (S + 1), v = (j + 0.33) / (S + 1), w = 1 - u - v;
      if (w < 0.12 || u < 0.12 || v < 0.12) continue;
      const p = px(A[0] * u + B[0] * v + C[0] * w, A[1] * u + B[1] * v + C[1] * w);
      tot++; if (p[3] < 128) continue;
      r += p[0]; gg += p[1]; b += p[2]; n++;
    }
    return n / tot < 0.5 ? null : [r / n, gg / n, b / n];
  };
  const jitter = c => { const f = 1 + (rnd() - 0.5) * 0.08; return c.map(v => Math.max(0, Math.min(255, v * f))); };
  const tris = [];
  for (let t = 0; t < del.triangles.length; t += 3) {
    const P = [pts[del.triangles[t]], pts[del.triangles[t + 1]], pts[del.triangles[t + 2]]];
    const col = triColor(...P);
    if (col) tris.push({ P, c: jitter(col) });
  }

  const K = 48;
  let cents = []; for (let i = 0; i < K; i++) cents.push(tris[Math.floor(rnd() * tris.length)].c.slice());
  const d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;
  const nearest = c => { let bi = 0, bd = 1e12; cents.forEach((z, i) => { const d = d2(c, z); if (d < bd) { bd = d; bi = i; } }); return bi; };
  for (let it = 0; it < 25; it++) {
    const acc = cents.map(() => [0, 0, 0, 0]);
    for (const t of tris) { const i = nearest(t.c); acc[i][0] += t.c[0]; acc[i][1] += t.c[1]; acc[i][2] += t.c[2]; acc[i][3]++; }
    cents = acc.map((a, i) => a[3] ? [a[0] / a[3], a[1] / a[3], a[2] / a[3]] : cents[i]);
  }
  const hex = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
  const r1 = v => Math.round(v * 10) / 10;
  const left = [], right = [];
  for (const t of tris) {
    const cx = (t.P[0][0] + t.P[1][0] + t.P[2][0]) / 3;
    (cx < CX ? left : right).push([...t.P.flatMap(([x, y]) => [r1(x), r1(y)]), nearest(t.c)]);
  }
  document.getElementById('out').textContent = JSON.stringify({ w: W, h: H, palette: cents.map(hex), left, right });
}
</script>
</body></html>
